<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="./images/logo.ico" type="image/x-icon" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIRA Portfolio | Verified Platforms &amp; Client Engagements</title>
    <meta
      name="description"
      content="Explore DIRA's technology portfolio, including DHUB, SHESA Connect, community platforms, and regional digital readiness programmes."
    />
    <meta
      property="og:title"
      content="DIRA Portfolio | Real Platforms &amp; Engagements"
    />
    <meta
      property="og:description"
      content="Explore DIRA's platforms, institutional engagements, and regional digital readiness programmes across Cameroon."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://diracmr.com/images/logo.jpg" />
    <link rel="canonical" href="https://diracmr.com/portfolio.html" />
    <meta property="og:url" content="https://diracmr.com/portfolio.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://diracmr.com/images/logo.jpg">
    <!-- Using custom SVG icons; removed FontAwesome to avoid generic icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/dira-design.css">
    <link rel="stylesheet" href="./style/header.css" />
    <link rel="stylesheet" href="./style/inner.css">
    <link rel="stylesheet" href="./style/pg-portfolio.css">
  </head>

  <body class="large-header dira-page dira-inner pg-portfolio" data-static-bg>
        <header>
        <!-- injected from header.js -->
    </header>
    <main id="main">

        <section id="home" class="in-hero dira-atmosphere">
            <div class="dira-container in-hero__grid">
                <div class="in-hero__copy reveal">
                    <h1 class="dira-display">DIRA <span class="dira-gradient-text">Portfolio</span></h1>
                    <p class="in-lede">Platforms, institutional systems, community technology, and regional digital readiness programmes across Cameroon and beyond.</p>
                </div>
                <div class="in-hero__aside pf-jump reveal">
                    <label class="pf-jump__label" for="category">Jump to Project:</label>
                    <select class="pf-select" id="category" onchange="if (this.value) location.hash = this.value;">
<option value="">-- All Projects --</option>
<option value="#dhub">DHUB (Flagship Housing Marketplace)</option>
<option value="#shesa">SHESA Connect (Alumni Platform)</option>
<option value="#nw-gpidrs">NW-GPIDRS (Public-Sector Digital Readiness)</option>
<option value="#nwdrs">NWDRS (SME Digital Readiness)</option>
<option value="#aswedo">ASWEDO Cameroon (Nonprofit Portal)</option>
<option value="#marketplace">
            Pan-African Marketplace (Commercial)
          </option>
<option value="#cybfc">Camer Young Boyz FC (Sports Showcase)</option>
<option value="#foundation">
            DIRA Foundation (Community &amp; Literacy)
          </option>
<option value="#opendreams">Open Dreams (Scholarship Portal)</option>
<option value="#agrichain">AgriChain AI (Research Prototype)</option>
</select>
                </div>
            </div>
        </section>

        <section id="portfolio" class="in-section pf-work">
            <div class="dira-container">
                <div class="in-head reveal">
                    <h2 class="dira-headline-lg">Projects, Programmes &amp; Products</h2>
                </div>
                <div id="portfolio-grid" class="pf-grid">
                    <!-- projects injected from portfolio.js -->
                </div>
            </div>
        </section>

        <!-- Case study quick view (opened from project cards) -->
        <div class="modal-overlay" id="case-study-modal" onclick="if (event.target === this) closeCaseStudyModal();">
<div class="modal-box">
<button aria-label="Close modal" class="modal-close" onclick="closeCaseStudyModal()">
            ×
          </button>
<span class="modal-badge" id="modalBadge">Category</span>
<h2 class="modal-title" id="modalTitle">Project Title</h2>
<div class="modal-section-title">Overview</div>
<p class="modal-text" id="modalDesc"></p>
<div class="modal-section-title">The Problem Solved</div>
<p class="modal-text" id="modalProblem"></p>
<div class="modal-section-title">Approach &amp; Outputs</div>
<p class="modal-text" id="modalTech"></p>
<div class="modal-actions" id="modalActions"></div>
</div>
</div>

    </main>
<footer>
      <!-- injected from header.js -->
    </footer>

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"
    ></script>
    <script src="./js/contact.js"></script>
    <script src="./js/header.js"></script>
    <script src="./js/portfolio.js"></script>
    <script src="./js/newsletter.js"></script>
    <script src="./js/testimonial-toast.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="./js/animate.js"></script>
  </body>
</html>
